<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luddies | Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../style/tokens.css">
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/components.css">
    <link rel="stylesheet" href="../style/layout.css">
    <link rel="stylesheet" href="../style/pages/home.css">
    <script src="../js/luddies-storage-keys.js"></script>
    <script src="../js/catalog-seed.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/auth-guard.js"></script>
</head>
<body class="page-home" data-site-page="home">
    <header id="site-header"></header>

    <main>
        <section class="hero-about home-hero-section">
            <div class="container">
                <div class="row align-items-center g-4">
                    <div class="col-12 col-lg-6 fade-in">
                        <h1 class="hero-title mb-3" data-i18n="home_hero_title"></h1>
                        <p class="hero-lead mb-4" data-i18n="home_hero_lead"></p>
                    </div>
                    <div class="col-12 col-lg-6 fade-in">
                        <div class="hero-image-wrap">
                            <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1200&q=80" alt="" data-i18n="home_hero_img_alt" width="1200" height="800">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="page-section pt-0">
            <div class="container">
                <div class="text-center mb-4 fade-in">
                    <h2 class="section-title mb-2" data-i18n="home_value_title"></h2>
                    <p class="section-subtitle" data-i18n="home_value_subtitle"></p>
                </div>
                <div class="row g-4">
                    <div class="col-12 col-md-4 fade-in">
                        <article class="brand-card h-100 p-4 p-lg-4">
                            <span class="pill-icon mb-3" aria-hidden="true"><i class="fas fa-school"></i></span>
                            <h3 class="h5 mb-3" data-i18n="home_val_b2b_title"></h3>
                            <p class="mb-0" data-i18n="home_val_b2b_desc"></p>
                        </article>
                    </div>
                    <div class="col-12 col-md-4 fade-in">
                        <article class="brand-card h-100 p-4 p-lg-4">
                            <span class="pill-icon mb-3" aria-hidden="true"><i class="fas fa-earth-americas"></i></span>
                            <h3 class="h5 mb-3" data-i18n="home_val_spanish_title"></h3>
                            <p class="mb-0" data-i18n="home_val_spanish_desc"></p>
                        </article>
                    </div>
                    <div class="col-12 col-md-4 fade-in">
                        <article class="brand-card h-100 p-4 p-lg-4">
                            <span class="pill-icon mb-3" aria-hidden="true"><i class="fas fa-sitemap"></i></span>
                            <h3 class="h5 mb-3" data-i18n="home_val_standard_title"></h3>
                            <p class="mb-0" data-i18n="home_val_standard_desc"></p>
                        </article>
                    </div>
                </div>
            </div>
        </section>

        <section class="page-section pt-0">
            <div class="container">
                <div class="text-center mb-4 fade-in">
                    <h2 class="section-title mb-2" data-i18n="home_lines_title"></h2>
                </div>
                <div class="row g-4">
                    <div class="col-12 col-sm-6 col-xl-3 fade-in">
                        <article class="brand-card home-line-card h-100 p-4">
                            <span class="home-line-icon" aria-hidden="true"><i class="fas fa-file-pdf"></i></span>
                            <h3 class="h5 mb-3" data-i18n="home_line_digital_title"></h3>
                            <p class="mb-0" data-i18n="home_line_digital_desc"></p>
                        </article>
                    </div>
                    <div class="col-12 col-sm-6 col-xl-3 fade-in">
                        <article class="brand-card home-line-card h-100 p-4">
                            <span class="home-line-icon" aria-hidden="true"><i class="fas fa-brain"></i></span>
                            <h3 class="h5 mb-3" data-i18n="home_line_neuro_title"></h3>
                            <p class="mb-0" data-i18n="home_line_neuro_desc"></p>
                        </article>
                    </div>
                    <div class="col-12 col-sm-6 col-xl-3 fade-in">
                        <article class="brand-card home-line-card h-100 p-4">
                            <span class="home-line-icon" aria-hidden="true"><i class="fas fa-certificate"></i></span>
                            <h3 class="h5 mb-3" data-i18n="home_line_cert_title"></h3>
                            <p class="mb-0" data-i18n="home_line_cert_desc"></p>
                        </article>
                    </div>
                    <div class="col-12 col-sm-6 col-xl-3 fade-in">
                        <article class="brand-card home-line-card h-100 p-4">
                            <span class="home-line-icon" aria-hidden="true"><i class="fas fa-box-open"></i></span>
                            <h3 class="h5 mb-3" data-i18n="home_line_kits_title"></h3>
                            <p class="mb-0" data-i18n="home_line_kits_desc"></p>
                        </article>
                    </div>
                </div>
            </div>
        </section>

        <section class="page-section pt-0">

                <div class="home-highlight-block fade-in">
                    <div class="text-center mb-4">
                        <h2 class="section-title mb-2" data-i18n="home_hierarchy_title"></h2>
                        <p class="home-step-desc" data-i18n="home_hierarchy_subtitle"></p>
                    </div>
                    <div class="home-steps">

                    <div class="home-step">
                        <div class="home-step-icon">01</div>
                        <p class="home-step-title" data-i18n="home_step_focus"></p>
                        <p class="home-step-desc" data-i18n="home_step_focus_desc"></p>
                        <p class="home-step-example" data-i18n="home_step_focus_example"></p>
                    </div>

                    <div class="home-step">
                        <div class="home-step-icon">02</div>
                        <p class="home-step-title" data-i18n="home_step_theme"></p>
                        <p class="home-step-desc" data-i18n="home_step_theme_desc"></p>
                        <p class="home-step-example" data-i18n="home_step_theme_example"></p>
                    </div>

                    <div class="home-step">
                        <div class="home-step-icon">03</div>
                        <p class="home-step-title" data-i18n="home_step_class"></p>
                        <p class="home-step-desc" data-i18n="home_step_class_desc"></p>
                        <p class="home-step-example" data-i18n="home_step_class_example"></p>
                    </div>

                    <div class="home-step">
                        <div class="home-step-icon">04</div>
                        <p class="home-step-title" data-i18n="home_step_reinforce"></p>
                        <p class="home-step-desc" data-i18n="home_step_reinforce_desc"></p>
                        <p class="home-step-example" data-i18n="home_step_reinforce_example"></p>
                    </div>
                </div>
            </div>
        </div>
        </section>

        <section class="page-section pt-0">
            <div class="container">
                <div class="text-center mb-4 fade-in">
                    <h2 class="section-title mb-2" data-i18n="home_featured_title"></h2>
                </div>
                <div class="row g-4">
                    <div class="col-12 col-md-4 fade-in">
                        <a class="brand-card home-featured-card p-4 h-100" href="catalog.html#destacados">
                            <h3 class="h5 mb-2" data-i18n="home_feat_1_title"></h3>
                            <p class="mb-0" data-i18n="home_feat_1_desc"></p>
                            <span class="home-featured-more" data-i18n="home_cta_catalog"></span>
                        </a>
                    </div>
                    <div class="col-12 col-md-4 fade-in">
                        <a class="brand-card home-featured-card p-4 h-100" href="catalog.html#destacados">
                            <h3 class="h5 mb-2" data-i18n="home_girls_title"></h3>
                            <p class="mb-0" data-i18n="home_girls_lead"></p>
                            <span class="home-featured-more" data-i18n="home_cta_catalog"></span>
                        </a>
                    </div>
                    <div class="col-12 col-md-4 fade-in">
                        <a class="brand-card home-featured-card p-4 h-100" href="catalog.html#destacados">
                            <h3 class="h5 mb-2" data-i18n="home_feat_3_title"></h3>
                            <p class="mb-0" data-i18n="home_feat_3_desc"></p>
                            <span class="home-featured-more" data-i18n="home_cta_catalog"></span>
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <section class="page-section pt-0 home-cta-band">
            <div class="container">
                <div class="home-highlight-block p-4 p-md-5 text-center fade-in">
                    <h2 class="section-title mb-3" data-i18n="home_cta_band_title"></h2>
                    <p class="mb-4 home-cta-band-lead" data-i18n="home_cta_band_lead"></p>
                    <div class="d-flex flex-wrap gap-3 justify-content-center">
                        <a class="btn btn-luddies btn-luddies--primary" href="catalog.html" data-i18n="home_cta_band_catalog"></a>
                        <a class="btn btn-luddies btn-luddies--primary" href="contact.html" data-i18n="home_cta_band_contact"></a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="site-footer" class="footer-lite"></footer>

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script defer src="../js/i18n.js"></script>
    <script defer src="../js/layout.js"></script>
    <script defer src="../js/auth-ui.js"></script>
    <script defer src="../js/fade-in.js"></script>
