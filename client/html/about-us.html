<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us | Luddies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../style/tokens.css">
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/components.css">
    <link rel="stylesheet" href="../style/layout.css">
    <link rel="stylesheet" href="../style/pages/about.css">
    <script src="../js/luddies-storage-keys.js"></script>
    <script src="../js/catalog-seed.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/auth-guard.js"></script>
</head>
<body data-site-page="about">
    <header id="site-header"></header>

    <main>
        <!-- Hero about section -->
        <section class="hero-about">
            <div class="container">
                <div class="row align-items-center g-4">
                    <div class="col-12 col-lg-6 fade-in">
                        <h1 class="hero-title mb-3" data-i18n="hero_title"></h1>
                        <p class="hero-lead mb-4" data-i18n="hero_lead"></p>
                        <a class="btn btn-lg btn-luddies btn-luddies--primary px-4 py-2" href="#team" data-i18n="hero_cta"></a>
                    </div>
                    <div class="col-12 col-lg-6 fade-in">
                        <div class="hero-image-wrap">
                            <img src="https://images.unsplash.com/photo-1522071901873-411886a10004?auto=format&fit=crop&w=1200&q=80" alt="" data-i18n="hero_image_alt">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- About who section -->
        <section class="page-section pt-0 about-who-section">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-xl-10 text-center fade-in">
                        <h2 class="section-title" data-i18n="who_title"></h2>
                        <p class="section-subtitle" data-i18n="who_desc"></p>
                    </div>
                </div>
            </div>
        </section>

        <section class="page-section pt-0">
            <div class="container">
                <div class="row g-4">
                    <div class="col-12 col-md-6 fade-in">
                        <article class="brand-card h-100 p-4 p-lg-5">
                            <span class="pill-icon mb-3" aria-hidden="true"><i class="fas fa-bullseye"></i></span>
                            <h3 class="h4 mb-3" data-i18n="mission_title"></h3>
                            <p class="mb-0" data-i18n="mission_desc"></p>
                        </article>
                    </div>
                    <div class="col-12 col-md-6 fade-in">
                        <article class="brand-card h-100 p-4 p-lg-5">
                            <span class="pill-icon mb-3" aria-hidden="true"><i class="fas fa-eye"></i></span>
                            <h3 class="h4 mb-3" data-i18n="vision_title"></h3>
                            <p class="mb-0" data-i18n="vision_desc"></p>
                        </article>
                    </div>
                </div>
            </div>
        </section>

        <!-- Values Section -->
        <section class="page-section pt-0">
            <div class="container">
                <div class="text-center mb-4 fade-in">
                    <h2 class="section-title mb-2" data-i18n="values_title"></h2>
                    <p class="section-subtitle" data-i18n="values_subtitle"></p>
                </div>
                <div class="row g-4">
                    <div class="col-12 col-md-6 col-xl-4 fade-in">
                        <article class="brand-card h-100 p-4">
                            <span class="pill-icon mb-3" aria-hidden="true"><i class="fas fa-lightbulb"></i></span>
                            <h3 class="h5" data-i18n="val_inno_title"></h3>
                            <p class="mb-0" data-i18n="val_inno_desc"></p>
                        </article>
                    </div>
                    <div class="col-12 col-md-6 col-xl-4 fade-in">
                        <article class="brand-card h-100 p-4">
                            <span class="pill-icon mb-3" aria-hidden="true"><i class="fas fa-people-group"></i></span>
                            <h3 class="h5" data-i18n="val_inclu_title"></h3>
                            <p class="mb-0" data-i18n="val_inclu_desc"></p>
                        </article>
                    </div>
                    <div class="col-12 col-md-6 col-xl-4 fade-in">
                        <article class="brand-card h-100 p-4">
                            <span class="pill-icon mb-3" aria-hidden="true"><i class="fas fa-award"></i></span>
                            <h3 class="h5" data-i18n="val_excel_title"></h3>
                            <p class="mb-0" data-i18n="val_excel_desc"></p>
                        </article>
                    </div>
                </div>
            </div>
        </section>

        <!-- Team section -->
        <section class="page-section team-section" id="team" >
            <div class="container">
                <div class="text-center team-section__intro fade-in">
                    <h2 class="section-title mb-2" data-i18n="team_title"></h2>
                    <p class="section-subtitle mb-0" data-i18n="team_subtitle"></p>
                </div>
                <div class="carousel-bleed">
                    <div class="carrusel" id="carrusel">
                        <button class="nav-btn prev" id="btn-prev" draggable="false">⟨</button>
                        <button class="nav-btn next" id="btn-next" draggable="false">⟩</button>
                        <div id="track" class="track"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="site-footer" class="footer-lite"></footer>

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script defer src="../js/i18n.js"></script>
    <script defer src="../js/layout.js"></script>
    <script defer src="../js/auth-ui.js"></script>
    <script defer src="../js/fade-in.js"></script>
    <script defer src="../js/about-team.js"></script>
    <script defer src="../js/carousel.js"></script>
</body>
</html>
