<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog | Luddies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../style/tokens.css">
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/components.css">
    <link rel="stylesheet" href="../style/layout.css">
    <link rel="stylesheet" href="../style/pages/catalog.css">
    <script src="../js/luddies-storage-keys.js"></script>
    <script src="../js/catalog-seed.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/auth-guard.js"></script>
</head>
<body class="page-catalog" data-site-page="catalog">
    <header id="site-header"></header>

    <main>
        <section class="hero-about catalog-hero">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-lg-9 text-center fade-in">
                        <h1 class="hero-title mb-3" data-i18n="catalog_hero_title"></h1>
                        <p class="hero-lead catalog-hero-lead mx-auto mb-0" data-i18n="catalog_hero_lead"></p>
                    </div>
                </div>
            </div>
        </section>

        <section class="page-section pt-0" id="destacados" aria-label="Catalog">
            <div class="container">
                <div class="catalog-mobile-filter-sticky d-lg-none" role="region" aria-labelledby="catalog-mobile-filter-ann">
                    <span class="visually-hidden" id="catalog-mobile-filter-ann" data-i18n="cat_filter_open"></span>
                    <button
                        type="button"
                        class="catalog-mobile-filter-btn"
                        data-bs-toggle="offcanvas"
                        data-bs-target="#catalogFiltersOffcanvas"
                        aria-controls="catalogFiltersOffcanvas"
                    >
                        <span class="catalog-mobile-filter-btn__icon" aria-hidden="true"><i class="fa-solid fa-sliders"></i></span>
                        <span class="catalog-mobile-filter-btn__label" data-i18n="cat_filter_open"></span>
                        <span class="catalog-mobile-filter-btn__current" id="catalog-active-filter-label"></span>
                    </button>
                </div>
                <div class="row g-4 g-xl-5 catalog-layout-row">
                    <aside class="col-12 col-lg-3 d-none d-lg-block">
                        <nav class="catalog-sidebar catalog-filter-root" id="catalog-sidebar-filters" aria-labelledby="catalog-filter-heading">
                            <h2 class="catalog-sidebar-title" id="catalog-filter-heading" data-i18n="cat_filter_label"></h2>
                            <div class="catalog-filter-stack">
                                <button type="button" class="catalog-filter-btn active" data-catalog-filter="all" aria-pressed="true" data-i18n="cat_filter_all"></button>
                                <button type="button" class="catalog-filter-btn" data-catalog-filter="science" aria-pressed="false" data-i18n="cat_filter_science"></button>
                                <button type="button" class="catalog-filter-btn" data-catalog-filter="technology" aria-pressed="false" data-i18n="cat_filter_technology"></button>
                                <button type="button" class="catalog-filter-btn" data-catalog-filter="engineering" aria-pressed="false" data-i18n="cat_filter_engineering"></button>
                                <button type="button" class="catalog-filter-btn" data-catalog-filter="mathematics" aria-pressed="false" data-i18n="cat_filter_mathematics"></button>
                                <button type="button" class="catalog-filter-btn" data-catalog-filter="neurodiversity" aria-pressed="false" data-i18n="cat_filter_neurodiversity"></button>
                                <button type="button" class="catalog-filter-btn" data-catalog-filter="certification" aria-pressed="false" data-i18n="cat_filter_certification"></button>
                                <button type="button" class="catalog-filter-btn" data-catalog-filter="physical" aria-pressed="false" data-i18n="cat_filter_physical"></button>
                                <button type="button" class="catalog-filter-btn" data-catalog-filter="dissidents" aria-pressed="false" data-i18n="cat_filter_dissidents"></button>
                            </div>
                        </nav>
                    </aside>

                    <div class="col-12 col-lg-9 catalog-grid-area">
                        <div class="row catalog-products-row" id="catalog-products-container">
                            <!--Catalog items will be inserted here -->
                        </div>
                    </div>
                </div>

                <div class="row catalog-publish-row">
                    <div class="col-12 col-lg-9 offset-lg-3 catalog-publish-wrap fade-in">
                        <h2 class="section-title mb-3" id="catalog-publish-cta-title" data-i18n="catalog_publish_cta_title"></h2>
                        <p class="catalog-publish-lead mb-4" data-i18n="catalog_publish_cta_lead"></p>
                        <div class="d-flex flex-wrap gap-3 catalog-publish-actions">
                            <a class="btn btn-luddies btn-luddies--primary" href="contact.html" data-i18n="catalog_publish_cta_contact"></a>
                            <a class="btn btn-luddies btn-luddies--outline" href="terms.html" data-i18n="catalog_publish_cta_terms"></a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="site-footer" class="footer-lite"></footer>

    <div
        class="offcanvas offcanvas-start catalog-filters-offcanvas"
        tabindex="-1"
        id="catalogFiltersOffcanvas"
        aria-labelledby="catalogFiltersOffcanvasLabel"
    >
        <div class="offcanvas-header border-bottom border-opacity-10">
            <h2 class="offcanvas-title catalog-filters-offcanvas__title" id="catalogFiltersOffcanvasLabel" data-i18n="cat_filter_label"></h2>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <nav class="catalog-filter-root" aria-labelledby="catalogFiltersOffcanvasLabel">
                <div class="catalog-filter-stack">
                    <button type="button" class="catalog-filter-btn active" data-catalog-filter="all" aria-pressed="true" data-i18n="cat_filter_all"></button>
                    <button type="button" class="catalog-filter-btn" data-catalog-filter="science" aria-pressed="false" data-i18n="cat_filter_science"></button>
                    <button type="button" class="catalog-filter-btn" data-catalog-filter="technology" aria-pressed="false" data-i18n="cat_filter_technology"></button>
                    <button type="button" class="catalog-filter-btn" data-catalog-filter="engineering" aria-pressed="false" data-i18n="cat_filter_engineering"></button>
                    <button type="button" class="catalog-filter-btn" data-catalog-filter="mathematics" aria-pressed="false" data-i18n="cat_filter_mathematics"></button>
                    <button type="button" class="catalog-filter-btn" data-catalog-filter="neurodiversity" aria-pressed="false" data-i18n="cat_filter_neurodiversity"></button>
                    <button type="button" class="catalog-filter-btn" data-catalog-filter="certification" aria-pressed="false" data-i18n="cat_filter_certification"></button>
                    <button type="button" class="catalog-filter-btn" data-catalog-filter="physical" aria-pressed="false" data-i18n="cat_filter_physical"></button>
                    <button type="button" class="catalog-filter-btn" data-catalog-filter="dissidents" aria-pressed="false" data-i18n="cat_filter_dissidents"></button>
                </div>
            </nav>
        </div>
    </div>

    <div
        id="catalog-cart-toast"
        class="catalog-cart-toast"
        role="status"
        aria-live="polite"
        aria-atomic="true"
        hidden
    >
        <span class="catalog-cart-toast__icon" aria-hidden="true"><i class="fa-solid fa-circle-check"></i></span>
        <div class="catalog-cart-toast__body">
            <p class="catalog-cart-toast__msg" id="catalog-cart-toast-msg"></p>
            <a class="catalog-cart-toast__link" href="checkout.html" data-i18n="cat_cart_review"></a>
        </div>
        <button type="button" class="catalog-cart-toast__close" id="catalog-cart-toast-close">
            <span aria-hidden="true">&times;</span>
            <span class="visually-hidden" data-i18n="cat_cart_toast_close"></span>
        </button>
    </div>

    <div class="catalog-cart-bar" id="catalog-cart-bar" hidden>
        <span class="catalog-cart-bar-text" id="catalog-cart-bar-text" aria-live="polite"></span>
        <a class="btn btn-sm btn-luddies btn-luddies--secondary" href="checkout.html" data-i18n="cat_cart_review"></a>
        <button type="button" class="btn btn-sm btn-luddies btn-luddies--outline" id="catalog-cart-clear" data-i18n="cat_cart_clear"></button>
    </div>
    <p class="sr-only-visually-hidden" id="catalog-cart-live" aria-live="assertive"></p>

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script defer src="../js/i18n.js"></script>
    <script defer src="../js/layout.js"></script>
    <script defer src="../js/auth-ui.js"></script>
    <script defer src="../js/catalog-builder.js"></script>
    <script defer src="../js/fade-in.js"></script>
    <script defer src="../js/catalog-filter.js"></script>
    <script defer src="../js/catalog-cart.js"></script>

    <template id="catalog-card-tpl">
  <div class="col-12 col-md-6 catalog-grid-item">
    <article class="brand-card catalog-card h-100 d-flex flex-column">
      <img class="catalog-card-img" src="" alt="" width="800" height="440">
      <div class="catalog-card-body">
        <p class="catalog-card-meta"></p>
        <h3 class="catalog-card-title h5"></h3>
        <p class="catalog-card-desc"></p>
        <p class="catalog-card-price"></p>
        <div class="catalog-card-actions">
          <button type="button"
            class="btn btn-sm btn-luddies btn-luddies--primary js-catalog-acquire"
          ></button>
          <a class="btn btn-sm btn-luddies btn-luddies--outline"
             href="contact.html"
          ></a>
        </div>
        <div class="catalog-card-footer">
          <span class="catalog-badge"></span>
        </div>
      </div>
    </article>
  </div>
</template>

</body>
</html>
